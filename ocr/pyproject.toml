[project]
name = "ocr"
version = "0.1.0"
description = ""
authors = [
    {name = "suryanox", email = "sooraj.crafts@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pyhocon (>=0.3.60,<0.4.0)",
    "psycopg2-binary (>=2.9.0,<3.0.0)",
    "python-telegram-bot (>=21.0,<22.0)",
    "paddleocr (>=3.7.0,<4.0.0)",
    "paddlepaddle (>=3.0.0,<4.0.0)"
]

[tool.poetry]
packages = [
    { include = "reciply_ocr", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
