[project]
name = "ocr"
version = "0.1.0"
description = ""
authors = [
    {name = "suryanox", email = "sooraj.crafts@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.2,<0.53.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "paddleocr (>=3.7.0,<4.0.0)"
