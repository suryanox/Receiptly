app {
  name = "Receiptly OCR"
  # How often to poll the database for new (PENDING) receipts.
  pollIntervalSeconds = 120
}

database {
  # Override via DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD when running
  # somewhere other than the local docker-compose Postgres.
  url = "postgresql://localhost:5432/receiptly"
  user = "postgres"
  password = "postgres"
  maxPoolSize = 5
}

openrouter {
  # Set via OPENROUTER_API_KEY. Never commit a real key.
  apiKey = ""
  # Optional explicit model id. When empty, a free vision+text model is auto-selected.
  model = ""
}

telegram {
  # Set via TELEGRAM_BOT_TOKEN. Never commit a real token.
  botToken = ""
}